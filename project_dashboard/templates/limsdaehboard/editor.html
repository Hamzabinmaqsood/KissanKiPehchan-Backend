{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Editor — Agri One-OS (K2P)</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --green: #2E9E33;
      --green-dark: #1B5E20;
      --green-deep: #14561A;
      --navy: #1F3864;
      --line: #E3E6EA;
      --ink: #1A1A1A;
      --muted: #6B7280
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #F3F5F7;
      color: var(--ink)
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--green-deep);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
      flex-wrap: wrap
    }

    .topbar h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-right: auto
    }

    .topbar h1 small {
      display: block;
      font-family: 'Inter';
      font-size: 11.5px;
      font-weight: 400;
      opacity: .8;
      letter-spacing: 0
    }

    .btn {
      font: 600 13px 'Inter', sans-serif;
      border: 0;
      border-radius: 7px;
      padding: 9px 16px;
      cursor: pointer;
      background: #fff;
      color: var(--green-deep);
      text-decoration: none;
      display: inline-block
    }

    .btn.primary {
      background: #F9A825;
      color: #3A2A00
    }

    .btn.line {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, .55)
    }

    .btn:hover {
      opacity: .9
    }

    .wrap {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      align-items: start
    }

    .nav {
      position: sticky;
      top: 60px;
      padding: 16px 12px;
      max-height: calc(100vh - 60px);
      overflow: auto
    }

    .nav a {
      display: block;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #42566B;
      text-decoration: none;
      border-radius: 7px
    }

    .nav a:hover {
      background: #E7EBEF
    }

    .nav a.active {
      background: var(--green-deep);
      color: #fff
    }

    .content {
      padding: 18px 22px 60px;
      max-width: 1150px
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
      scroll-margin-top: 72px
    }

    .card>h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 19px;
      letter-spacing: .4px;
      color: #fff;
      background: var(--navy);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .card>h2 .cnt {
      font: 600 11px 'Inter';
      background: rgba(255, 255, 255, .2);
      padding: 2px 8px;
      border-radius: 20px
    }

    .card .inner {
      padding: 14px 16px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px
    }

    .f {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .f label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      color: var(--muted);
      text-transform: uppercase
    }

    .f input,
    .f select,
    .f textarea {
      font: 400 13.5px 'Inter', sans-serif;
      padding: 9px 11px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      width: 100%
    }

    .f textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.45
    }

    .f input:focus,
    .f select:focus,
    .f textarea:focus {
      outline: 2px solid #A5D6A7;
      border-color: var(--green)
    }

    .f .hint {
      font-size: 11px;
      color: #9AA3AD
    }

    .f.color-f {
      flex-direction: row;
      align-items: center;
      gap: 8px
    }

    .f.color-f input[type=color] {
      width: 44px;
      height: 38px;
      padding: 2px;
      flex: none
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      background: #FAFBFC
    }

    .item .ihead {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px
    }

    .item .ihead b {
      font-size: 13px;
      color: var(--navy)
    }

    .item .ihead .sp {
      margin-left: auto;
      display: flex;
      gap: 6px
    }

    .mini {
      font: 600 11.5px 'Inter';
      border: 1px solid var(--line);
      background: #fff;
      color: #42566B;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer
    }

    .mini.danger {
      color: #C62828;
      border-color: #F1C4C4
    }

    .mini:hover {
      background: #EEF1F4
    }

    .addrow {
      margin-top: 2px
    }

    .sub {
      border-left: 3px solid #DDE3E8;
      padding-left: 12px;
      margin: 10px 0 4px
    }

    .sub>h4 {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px
    }

    .preview {
      margin-top: 16px;
      border: 1px solid #CDE6CE;
      background: #F3F9F3;
      border-radius: 10px;
      padding: 12px 14px
    }

    .preview h4 {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: #1B5E20;
      margin-bottom: 8px
    }

    .preview p {
      font-size: 13px;
      color: #5A6672
    }

    .prow {
      display: grid;
      grid-template-columns: 170px 1fr auto;
      gap: 10px;
      align-items: baseline;
      font-size: 13px;
      padding: 5px 0;
      border-top: 1px solid #DEEBDE
    }

    .prow:first-of-type {
      border-top: 0
    }

    .prow span {
      color: #5A6672
    }

    .prow b {
      color: #14561A;
      font-weight: 700
    }

    .prow i {
      font-style: normal;
      font-size: 11.5px;
      color: #8A9AA0;
      text-align: right
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green-deep);
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      transition: transform .28s;
      z-index: 99
    }

    .toast.on {
      transform: translateX(-50%) translateY(0)
    }

    @media(max-width:900px) {
      .wrap {
        grid-template-columns: 1fr
      }

      .nav {
        position: static;
        max-height: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 12px 8px
      }

      .content {
        padding: 14px 16px 60px
      }

      .topbar {
        align-items: flex-start;
        gap: 8px;
        padding: 12px 16px
      }

      .topbar h1 {
        flex: 1 1 100%;
        margin-right: 0
      }

      .topbar .btn,
      .topbar label.btn {
        flex: 1 1 calc(50% - 8px);
        min-width: 140px
      }
    }

    @media(max-width:640px) {
      .topbar {
        padding: 12px 12px
      }

      .topbar .btn,
      .topbar label.btn {
        flex: 1 1 100%;
        width: 100%
      }

      .nav a {
        flex: 1 1 100%
      }

      .content {
        padding: 14px 12px 60px
      }

      .card {
        margin-bottom: 12px
      }

      .preview {
        padding: 12px
      }

      .prow {
        grid-template-columns: 1fr;
        gap: 6px;
        text-align: left
      }

      .prow b {
        margin-top: 4px
      }
    }
  </style>
</head>

<body>

    /* ============ DEFAULT DATA (identical to dashboard.html) ============ */

          kpis: [{ l: "Infra Setup", v: "65%" }, { l: "Cloud Services", v: "5 / 8" }, { l: "Security Compliance", v: "70%" }]
        },

        }

      ],

      ],

      snapshot: [

        { icon: "user", label: "VERIFIED SIGN-UPS", value: "18,230 / 120,000", pct: "15%", color: "#1976D2" },
        { icon: "users", label: "ACTIVE USERS (MAU)", value: "9,850 / 60,000", pct: "16%", color: "#F57C00" },
        { icon: "wallet", label: "PAYING USERS", value: "1,250 / 10,000", pct: "13%", color: "#7B3FA0" },
        { icon: "money", label: "REVENUE (PKR)", value: "8.6M / 50M", pct: "17%", color: "#00897B" }
      ],
      stakeTitle: "STAKEHOLDER ACTIONS & DEADLINES",
      stakeHead: ["STAKEHOLDER", "ACTION REQUIRED", "DUE DATE", "STATUS"],
      stakeholders: [
        { who: "All Stakeholders", action: "Submit Implementation Plan", due: "15th Aug 2026", status: "wait" },
        { who: "All Stakeholders", action: "Share Dependencies & Roadblocks", due: "15th Aug 2026", status: "wait" },
        { who: "All Stakeholders", action: "Confirm Action Items & Owners", due: "15th Aug 2026", status: "wait" }
      ],
      footer: [
        { icon: "target", title: "OUR GOAL", desc: "Deliver a robust, scalable and impactful system<br>for millions of farmers across Pakistan." },
        { icon: "team", title: "ONE TEAM. ONE GOAL.", desc: "MILLIONS OF FARMERS. LIMITLESS IMPACT.", bold: true },
        { icon: "leaf", title: "EMPOWER FARMERS.", desc: "DRIVE PROSPERITY.", bold: true },
        { icon: "sprout", title: "", desc: "Let's build the future of agriculture – together!", lite: true }
      ],

      /* ---- AUTO-CALCULATION SETTINGS ----
         Set any mode to "manual" to type that value yourself instead. */
      auto: {
        enabled: true,
        startDate: "2026-07-15",     // project start
        endDate: "2026-11-10",       // project end
        asOfDate: "2026-08-11",      // "as of" date = the reporting date
        overallMode: "weekly",       // weekly = latest actual % in the weekly table | parts = weighted avg of the 5 parts | manual
        partsMode: "kpis",           // kpis = each part % from its own KPI lines | manual
        varianceMode: "auto",        // actual - plan
        statusMode: "auto",          // week ticked once an actual % is entered
        planMode: "manual",          // linear = plan % spread evenly to 100% | manual
        periodsMode: "manual",       // auto = week dates generated from the start date | manual
        nodesMode: "auto",           // timeline dots follow the current week | manual
        plannedWindow: 5,            // how many weeks after the current one show as "Planned"
        snapshotMode: "auto",        // KPI snapshot % from actual / target
        healthMode: "auto",          // health from the latest variance
        daysMode: "auto",            // days elapsed / remaining from the dates
        durationMode: "auto",        // duration + date range from the dates
        currentWeekMode: "auto",     // week number + its date range from the dates
        titlesMode: "auto"           // week counts inside section titles
      }
    };

    /* =========================================================
       AUTO-CALCULATION ENGINE
       ========================================================= */
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const DAY = 864e5;
    function pDate(s) { const d = new Date(String(s || '') + "T00:00:00"); return isNaN(d.getTime()) ? null : d; }
    function fD(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
    function fDY(d) { return fD(d) + " " + d.getFullYear(); }
    function fRange(a, b, year) {
      if (!a || !b) return "";
      const y = year ? (" " + b.getFullYear()) : "";
      return a.getMonth() === b.getMonth()
        ? `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]}${y}`
        : `${fD(a)} – ${fD(b)}${y}`;
    }
    function toNum(s) {
      if (typeof s === 'number') return s;
      if (typeof s !== 'string') return NaN;
      const t = s.replace(/,/g, '').replace(/%/g, '').replace(/PKR|Rs\.?/gi, '').trim();
      const m = t.match(/^([+-]?\d*\.?\d+)\s*([KkMmBb])?$/);
      if (!m) return NaN;
      let n = parseFloat(m[1]); const suf = (m[2] || '').toLowerCase();
      if (suf === 'k') n *= 1e3; else if (suf === 'm') n *= 1e6; else if (suf === 'b') n *= 1e9;
      return n;
    }
    function ratioPct(s) {
      if (typeof s !== 'string') return NaN;
      const p = s.split('/');
      if (p.length === 2) { const a = toNum(p[0]), b = toNum(p[1]); if (isFinite(a) && isFinite(b) && b > 0) return a / b * 100; }
      const one = toNum(s);
      return (s.includes('%') && isFinite(one)) ? one : NaN;
    }

    function computeAll(D) {
      const A = D.auto || {};
      const out = { totals: null };
      if (A.enabled === false) return out;

      const start = pDate(A.startDate), end = pDate(A.endDate), asOf = pDate(A.asOfDate);
      let totalDays = 0, elapsed = 0, remaining = 0, totalWeeks = 0, curWeek = 1, wkS = null, wkE = null;
      if (start && end && asOf && end > start) {
        totalDays = Math.round((end - start) / DAY) + 1;
        elapsed = Math.max(0, Math.min(totalDays, Math.round((asOf - start) / DAY) + 1));
        remaining = Math.max(0, totalDays - elapsed);
        totalWeeks = Math.ceil(totalDays / 7);
        curWeek = Math.max(1, Math.min(totalWeeks, Math.ceil(elapsed / 7) || 1));
        wkS = new Date(start.getTime() + (curWeek - 1) * 7 * DAY);
        wkE = new Date(Math.min(end.getTime(), wkS.getTime() + 6 * DAY));
      }

      /* --- part % from its KPI lines --- */
      if (A.partsMode === 'kpis') {
        D.parts.forEach(p => {
          const vals = (p.kpis || []).map(k => ratioPct(k.v)).filter(v => isFinite(v));
          if (vals.length) p.progress = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
        });
      }

      /* --- weekly table: periods, plan, variance, status --- */
      D.weekly.forEach((w, i) => {
        if (A.planMode === 'linear' && totalWeeks) w.plan = Math.round((i + 1) / totalWeeks * 100) + "%";
        if (A.periodsMode === 'auto' && start) {
          const s = new Date(start.getTime() + i * 7 * DAY);
          const e = new Date(end ? Math.min(end.getTime(), s.getTime() + 6 * DAY) : s.getTime() + 6 * DAY);
          w.period = fRange(s, e, false);
        }
        const a = toNum(w.actual), p = toNum(w.plan);
        if (A.varianceMode !== 'manual') {
          if (isFinite(a) && isFinite(p)) { const v = Math.round((a - p) * 10) / 10; w.variance = (v > 0 ? '+' : '') + v + '%'; }

          const a = toNum(D.weekly[i].actual);
          if (isFinite(a)) { overall = a; overallFrom = 'latest actual % (' + D.weekly[i].week + ')'; break; }
        }

        let ws = 0, sum = 0;

      }

      if (A.nodesMode !== 'manual') {

        for (let i = 1; i <= n; i++)

      if (A.titlesMode !== 'manual') {

      /*
        Merge backend data with DEFAULT_DATA.

        DEFAULT_DATA now acts only as a UI fallback/schema reference.
        PostgreSQL/backend is the real source of truth.
      */
      function merge(base, over) {

        if (Array.isArray(over)) {
          return over;
        }

        if (
          over &&
          typeof over === 'object'
        ) {
          const output = {
            ...base
          };

          for (const key in over) {

            output[key] = merge(
              base
                ? base[key]
                : undefined,
              over[key]
            );
          }

          return output;
        }

        return (
          over === undefined
            ? base
            : over
        );
      }

        try {

          /*
            Do NOT call applyAutoCalculations() before saving.

            D contains the editable/source values.

            Django is responsible for final calculations:
              - project duration
              - current week
              - days elapsed
              - days remaining
              - overall progress
              - project health
              - part progress
              - variance
              - timeline states
              - snapshot percentages
          */
          const response =
            await apiFetch(
              '/api/project-dashboard/k2p/manage/',
              {
                method: 'PUT',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify(D)
              }
            );


          if (!response.ok) {

            let message =
              'Unable to save dashboard.';

            try {

              const body =
                await response.json();

              message =
                body.message ||
                body.detail ||
                JSON.stringify(body);

            } catch (e) { }

            throw new Error(message);
          }


          const result =
            await response.json();


          /*
            Backend returns the newly calculated live dashboard.
          */
          if (result.data) {

            D = merge(
              structuredClone(DEFAULT_DATA),
              result.data
            );
          }


          toast(
            'Saved successfully to the LIMS backend.'
          );


          if (open) {

            setTimeout(() => {

              window.open(
                '/api/lims-dashboard/',
                '_blank'
              );

            }, 300);
          }


        } catch (error) {

          console.error(error);

          toast(
            'Save failed: ' +
            error.message
          );


        } finally {

          buttons.forEach(button => {
            button.disabled = false;
          });
        }
      }


      /*
        Export now acts only as a backup.

        Exporting JSON does NOT publish/update the dashboard.
      */
      function exportJSON() {

        const blob =
          new Blob(
            [
              JSON.stringify(
                D,
                null,
                2
              )
            ],
            {
              type:
                'application/json'
            }
          );


        const a =
          document.createElement('a');

        a.href =
          URL.createObjectURL(blob);

        a.download =
          'k2p-dashboard-backup.json';

        a.click();


        URL.revokeObjectURL(
          a.href
        );


        toast(
          'Dashboard JSON backup exported.'
        );
      }


      /*
        Import only loads JSON into the editor.

        The user must still press Save to publish it.
      */
      function importJSON(input) {

        const file =
          input.files[0];

        if (!file) {
          return;
        }


        const reader =
          new FileReader();


        reader.onload = function () {

          try {

            const imported =
              JSON.parse(
                reader.result
              );


            D = merge(
              structuredClone(DEFAULT_DATA),
              imported
            );


            buildEditorForm();

            refreshPreview();

            setupNavigationObserver();


            toast(
              'Imported into the editor. ' +
              'Press Save to publish it to the backend.'
            );


          } catch (error) {

            console.error(error);

            toast(
              'That file is not valid dashboard JSON.'
            );
          }
        };


        reader.readAsText(file);

        input.value = '';
      }


      /*
        No localStorage exists anymore.

        Reset means discard unsaved browser changes and fetch
        the current backend values again.
      */
      function resetAll() {

        if (
          !confirm(
            'Discard unsaved changes and reload the current backend values?'
          )
        ) {
          return;
        }

        location.reload();
      }

    let tt;
    function toast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3000);
    }

    /* ============ NAVIGATION ============ */

      let navigationObserver = null;


      function setupNavigationObserver() {

        if (navigationObserver) {
          navigationObserver.disconnect();
        }


        const links = [
          ...nav.querySelectorAll('a')
        ];


        navigationObserver =
          new IntersectionObserver(
            entries => {

              entries.forEach(entry => {

                if (!entry.isIntersecting) {
                  return;
                }


                links.forEach(link => {

                  link.classList.toggle(
                    'active',

                    link.getAttribute(
                      'href'
                    ) ===
                    '#' +
                    entry.target.id
                  );

                });

              });

            },

            {
              rootMargin:
                '-70px 0px -70% 0px'
            }
          );


        SECTIONS.forEach(section => {

          const element =
            document.getElementById(
              section.id
            );


          if (element) {

            navigationObserver.observe(
              element
            );
          }

        });
      }


      /* ============ INITIALIZE EDITOR ============ */

      async function initEditor() {

        try {

          /*
            1. Get live PostgreSQL/backend data.
          */
          await loadEditorData();


          /*
            2. Build inputs using that data.
          */
          buildEditorForm();


          /*
            3. Show calculation preview.
          */
          refreshPreview();


          /*
            4. Enable sidebar highlighting.
          */
          setupNavigationObserver();


        } catch (error) {

          console.error(error);


          content.innerHTML = `
      <section class="card">

        <div class="inner">

          <h2>
            Dashboard could not be loaded
          </h2>

          <p>
            ${error.message}
          </p>

        </div>

      </section>
    `;
        }
      }


      /*
        requireAuth() returns a session only when the user
        successfully signs in.
      */
      if (SESSION) {
        initEditor();
      }
  </script>
